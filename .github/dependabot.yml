version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: weekly
  - package-ecosystem: "docker"
    directory: "/containers/django"
    schedule:
      interval: weekly
  - package-ecosystem: "docker"
    directory: "/containers/nginx"
    schedule:
      interval: weekly
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: weekly
