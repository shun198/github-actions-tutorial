name: Dependabot auto-approve and auto-merge

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve-and-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and enable auto-merge for minor and patch updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          current_sha="$(gh api "repos/$REPOSITORY/pulls/$PR_NUMBER" --jq '.head.sha')"
          if [ "$current_sha" != "$EXPECTED_SHA" ]; then
            echo "Pull request head changed during this workflow run; skipping approval and auto-merge."
            exit 0
          fi

          gh api --method POST "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --field event=APPROVE \
            --field commit_id="$EXPECTED_SHA" \
            --field body="Dependabot minor/patch update. GitHub auto-merge remains gated by repository requirements."

          gh pr merge "$PR_URL" --auto --merge --match-head-commit "$EXPECTED_SHA"
